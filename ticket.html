<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <title>Our Date Ticket</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* Same "Moonlit Orchard" tokens as the main site, kept in sync on purpose */
      :root {
        --cream: #fbf4ec;
        --cream-2: #f3e7da;
        --rose: #e8a6a0;
        --rose-deep: #c9787b;
        --plum: #4a2e3b;
        --gold: #c9a15a;
        --ink: #3a2a2e;
        --ink-soft: #6b5a5e;
        --white: #fffdfb;
        --glass: rgba(255, 253, 251, 0.6);
        --glass-border: rgba(255, 255, 255, 0.6);
        --shadow: 0 20px 60px rgba(74, 46, 59, 0.16);
        --font-display: "Cormorant Garamond", Georgia, serif;
        --font-body: "Manrope", system-ui, sans-serif;
      }
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Manrope:wght@500;700;800&display=swap");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(
            1200px 700px at 15% -10%,
            var(--cream-2),
            transparent 60%
          ),
          radial-gradient(
            1000px 800px at 110% 10%,
            var(--rose) 0%,
            transparent 42%
          ),
          linear-gradient(180deg, var(--cream), var(--cream-2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 18px;
      }
      h1,
      h2 {
        font-family: var(--font-display);
        margin: 0;
      }
      #state {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      .loader {
        opacity: 0.6;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
      }
      .not-found {
        background: var(--white);
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: var(--shadow);
      }
      .not-found .emoji {
        font-size: 2.6rem;
      }
      .not-found h2 {
        font-size: 1.5rem;
        margin: 10px 0 6px;
      }
      .not-found p {
        opacity: 0.65;
        font-size: 0.9rem;
      }
      .mascot-wrap {
        width: 84px;
        height: 84px;
        margin: 0 auto 6px;
      }
      .mascot-wrap svg {
        width: 100%;
        height: 100%;
      }
      @keyframes wave {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-20deg);
        }
      }
      .mascot-arm {
        transform-origin: 62px 58px;
        animation: wave 1.6s ease-in-out infinite;
      }
      #ticketCapture {
        background: var(--white);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
        width: 100%;
        display: flex;
        position: relative;
        border: 1px solid var(--glass-border);
      }
      .ticket-shine {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 40%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 60%
        );
        background-size: 250% 100%;
        animation: shineSlide 5s ease-in-out infinite;
        mix-blend-mode: overlay;
      }
      @keyframes shineSlide {
        0% {
          background-position: -120% 0;
        }
        100% {
          background-position: 120% 0;
        }
      }
      .verified-badge {
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: 9.5px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 999px;
        padding: 3px 8px;
      }
      .ticket-main {
        flex: 1;
        padding: 26px 24px;
        position: relative;
      }
      .ticket-eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .ticket-title {
        font-family: var(--font-display);
        font-size: 1.5rem;
        margin: 3px 0 14px;
        font-weight: 700;
      }
      .ticket-rule {
        height: 1px;
        background: linear-gradient(90deg, var(--gold), transparent);
        margin-bottom: 14px;
        opacity: 0.5;
      }
      .ticket-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        font-size: 0.76rem;
        padding: 7px 0;
        border-bottom: 1px solid rgba(74, 46, 59, 0.08);
      }
      .ticket-row span {
        flex: 0 0 auto;
        color: var(--ink-soft);
        font-weight: 600;
      }
      .ticket-row b {
        min-width: 0;
        font-weight: 800;
        text-align: right;
        overflow-wrap: anywhere;
      }
      .ticket-swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
        vertical-align: -1px;
        border: 1px solid rgba(0, 0, 0, 0.1);
      }
      .ticket-status {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        background: var(--ink);
        color: var(--white);
      }
      .ticket-status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7ed08a;
      }
      .ticket-stub {
        width: 118px;
        background:
          radial-gradient(circle at top, transparent 8px, var(--cream-2) 8.5px)
            top left / 20px 20px repeat-x,
          var(--cream-2);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px 10px;
      }
      .ticket-stub::before {
        content: "";
        position: absolute;
        left: -1px;
        top: 0;
        bottom: 0;
        border-left: 2px dashed rgba(74, 46, 59, 0.2);
      }
      .qr {
        background: #fff;
        padding: 6px;
        border-radius: 8px;
        min-width: 100px;
        min-height: 100px;
        display: grid;
        place-items: center;
      }
      .qr canvas {
        display: block;
      }
      .qr img {
        display: block;
        width: 88px;
        height: 88px;
      }
      .qr-fallback {
        width: 88px;
        height: 88px;
        display: block;
        border-radius: 4px;
      }
      .qr-note {
        width: 88px;
        min-height: 88px;
        border: 2px dashed var(--ink);
        color: var(--ink);
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.08em;
        line-height: 1.25;
        text-transform: uppercase;
        text-decoration: none;
      }
      .stub-vert {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1;
        white-space: nowrap;
        opacity: 0.5;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.85rem;
        background: linear-gradient(135deg, var(--rose), var(--rose-deep));
        color: #fff;
        box-shadow: 0 12px 26px rgba(201, 120, 123, 0.38);
      }
      .sound-pill {
        display: none;
        margin: 14px auto 0;
        padding: 9px 15px;
        font-size: 0.75rem;
        background: var(--white);
        color: var(--ink);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow);
      }
      .music-frame {
        display: none;
        width: min(360px, 92vw);
        aspect-ratio: 16 / 9;
        margin: 12px auto 0;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .music-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      @media (max-width: 480px) {
        #ticketCapture {
          flex-direction: column;
        }
        .ticket-stub {
          width: 100%;
          flex-direction: row;
        }
        .stub-vert {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="state">
      <p class="loader">loading your ticket…</p>
    </div>

    <script>
      (function () {
        "use strict";
        // Keep this in sync with index.html's CONFIG block.
        const CONFIG = {
          SUPABASE_URL: "https://ixrowaadhwdgcspdljig.supabase.co",
          SUPABASE_ANON_KEY:
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4cm93YWFkaHdkZ2NzcGRsamlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1ODY1MDgsImV4cCI6MjEwMTE2MjUwOH0.SGO24KrNtN5VqlwjhEdqVvlA45YRMc1CbS4FRvIU5Sk",
          BACKGROUND_MUSIC_URL:
            "https://youtu.be/4VR-6AS0-l4?si=7fV4RPdmDiDEL9g1",
        };

        function els(id) {
          return document.getElementById(id);
        }
        function formatDate(iso) {
          if (!iso) return "—";
          const d = new Date(iso + "T00:00:00");
          return d.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
          });
        }
        function mascotSVG() {
          return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="60" cy="100" rx="26" ry="6" fill="rgba(74,46,59,0.12)"/>
  <path d="M84 78 Q104 74 100 56" stroke="#f3e7da" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M36 34 L28 12 L50 28 Z" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <path d="M84 34 L92 12 L70 28 Z" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <path d="M37 28 L33 18 L44 26 Z" fill="#f3b6c2"/>
  <path d="M83 28 L87 18 L76 26 Z" fill="#f3b6c2"/>
  <ellipse cx="60" cy="66" rx="30" ry="26" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <circle cx="60" cy="42" r="26" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <ellipse cx="45" cy="48" rx="5" ry="3.4" fill="#f6c6cf" opacity="0.85"/>
  <ellipse cx="75" cy="48" rx="5" ry="3.4" fill="#f6c6cf" opacity="0.85"/>
  <circle cx="51" cy="40" r="3.4" fill="#3a2a2e"/>
  <circle cx="69" cy="40" r="3.4" fill="#3a2a2e"/>
  <circle cx="52.2" cy="38.7" r="1" fill="#fff"/>
  <circle cx="70.2" cy="38.7" r="1" fill="#fff"/>
  <path d="M58 46 Q60 48 62 46" stroke="#c9787b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M60 46 Q56 52 51 49 M60 46 Q64 52 69 49" stroke="#3a2a2e" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <ellipse class="mascot-arm" cx="84" cy="58" rx="7" ry="14" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <ellipse cx="36" cy="70" rx="7" ry="12" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5" transform="rotate(18 36 70)"/>
  <ellipse cx="48" cy="90" rx="9" ry="6" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
  <ellipse cx="72" cy="90" rx="9" ry="6" fill="#ffffff" stroke="#e8d9c9" stroke-width="1.5"/>
</svg>`;
        }

        function renderNotFound() {
          els("state").innerHTML = `
            <div class="not-found">
              <div class="emoji">🎫💔</div>
              <h2>Ticket Not Found</h2>
              <p>This link doesn't match a confirmed date ticket. Double check the QR code, or ask them to send you a fresh one.</p>
            </div>`;
        }

        function renderTicket(t) {
          els("state").innerHTML = `
            <div id="ticketCapture">
              <div class="ticket-shine"></div>
              <div class="verified-badge">✓ Verified</div>
              <div class="ticket-main">
                <div class="mascot-wrap" id="mascotHost"></div>
                <div class="ticket-eyebrow">Date Ticket · Admit Two</div>
                <div class="ticket-title">Our First Date</div>
                <div class="ticket-rule"></div>
                <div class="ticket-row"><span>Guest</span><b>You</b></div>
                <div class="ticket-row"><span>With</span><b>Me</b></div>
                <div class="ticket-row"><span>Food</span><b>${t.food || "—"}</b></div>
                <div class="ticket-row"><span>Movie</span><b>${t.movie || "—"}</b></div>
                <div class="ticket-row"><span>Date</span><b>${formatDate(t.date_day)}</b></div>
                <div class="ticket-row"><span>Time</span><b>${t.date_time || "—"}</b></div>
                <div class="ticket-row"><span>Meeting place</span><b>I'll tell you later</b></div>
                <div class="ticket-row"><span>Dress code</span><b><span class="ticket-swatch" style="background:${t.dress_color || "#ccc"}"></span>${t.dress_color || "—"}</b></div>
                <div class="ticket-status">CONFIRMED</div>
              </div>
              <div class="ticket-stub">
                <div class="qr" id="qrHolder"></div>
                <div class="stub-vert">DATE · CONFIRMED</div>
              </div>
            </div>
            <div class="actions">
              <button id="downloadBtn">⬇ Download as PNG</button>
            </div>
            <button class="sound-pill" id="soundBtn">▶ Play music</button>
            <div class="music-frame" id="musicHost"></div>
            <p style="opacity:.5;font-size:.72rem;margin-top:14px;">Ticket ID: ${t.id}</p>
          `;
          els("mascotHost").innerHTML = mascotSVG();
          setupTicketSound();
          function showQRFallback() {
            const holder = els("qrHolder");
            holder.innerHTML = "";
            const img = document.createElement("img");
            img.className = "qr-fallback";
            img.alt = "Date ticket QR code";
            img.src =
              "https://api.qrserver.com/v1/create-qr-code/?size=176x176&margin=8&data=" +
              encodeURIComponent(location.href);
            img.onerror = () => {
              holder.innerHTML =
                '<div class="qr-note">QR needs internet</div>';
            };
            holder.appendChild(img);
          }
          if (window.QRCode && QRCode.toCanvas) {
            QRCode.toDataURL(
              location.href,
              {
                width: 88,
                margin: 1,
                color: { dark: "#3A2A2E", light: "#FFFFFF" },
              },
              function (err, url) {
                if (err || !url) {
                  showQRFallback();
                  return;
                }
                const img = document.createElement("img");
                img.alt = "Date ticket QR code";
                img.src = url;
                els("qrHolder").appendChild(img);
              },
            );
          } else {
            showQRFallback();
          }
          els("downloadBtn").addEventListener("click", () => {
            if (!window.html2canvas) return;
            html2canvas(document.getElementById("ticketCapture"), {
              backgroundColor: null,
              scale: 2,
              useCORS: true,
            }).then((canvas) => {
              const link = document.createElement("a");
              link.download = "our-date-ticket.png";
              link.href = canvas.toDataURL("image/png");
              link.click();
            });
          });
        }

        function playTicketChime() {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return Promise.reject();
          const ctx = new AudioContext();
          const now = ctx.currentTime;
          [660, 880, 1108].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.34);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.36);
          });
          return ctx.resume().then(() => {
            setTimeout(() => ctx.close(), 800);
          });
        }

        function getYoutubeId(url) {
          try {
            const u = new URL(url);
            if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
            if (u.hostname.includes("youtube.com")) {
              if (u.pathname.startsWith("/embed/")) {
                return u.pathname.split("/")[2];
              }
              return u.searchParams.get("v");
            }
          } catch (e) {
            return null;
          }
          return null;
        }

        function playConfiguredMusic() {
          const url = CONFIG.BACKGROUND_MUSIC_URL;
          if (!url) return playTicketChime();
          const ytId = getYoutubeId(url);
          if (ytId) {
            els("musicHost").style.display = "block";
            els("musicHost").innerHTML =
              `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(
                ytId,
              )}?autoplay=1&playsinline=1&rel=0" title="Ticket music" allow="autoplay; encrypted-media"></iframe>`;
            return Promise.resolve();
          }
          const audio = new Audio(url);
          audio.volume = 0.35;
          audio.preload = "auto";
          return audio.play();
        }

        function setupTicketSound() {
          const btn = els("soundBtn");
          const hasConfiguredMusic = Boolean(CONFIG.BACKGROUND_MUSIC_URL);
          const isYoutubeMusic = Boolean(getYoutubeId(CONFIG.BACKGROUND_MUSIC_URL || ""));
          if (hasConfiguredMusic) btn.style.display = "inline-flex";
          const tryPlay = (fromGesture = false) => {
            if (isYoutubeMusic && !fromGesture) return;
            playConfiguredMusic()
              .then(() => {
                btn.style.display = "none";
              })
              .catch(() => {
                btn.style.display = "inline-flex";
              });
          };
          setTimeout(tryPlay, 350);
          btn.addEventListener("click", () => tryPlay(true));
          window.addEventListener("pointerdown", () => tryPlay(true), { once: true });
        }

        async function load() {
          const params = new URLSearchParams(location.search);
          const id = params.get("id");
          if (!id) return renderNotFound();
          if (
            !window.supabase ||
            !CONFIG.SUPABASE_URL ||
            !CONFIG.SUPABASE_ANON_KEY
          ) {
            els("state").innerHTML =
              '<p class="loader">Ticket lookup isn\'t configured yet — connect Supabase in ticket.html and index.html.</p>';
            return;
          }
          try {
            const client = window.supabase.createClient(
              CONFIG.SUPABASE_URL,
              CONFIG.SUPABASE_ANON_KEY,
            );
            const { data, error } = await client
              .from("tickets")
              .select("*")
              .eq("id", id)
              .single();
            if (error || !data) return renderNotFound();
            renderTicket(data);
          } catch (e) {
            console.warn(e);
            renderNotFound();
          }
        }
        load();
      })();
    </script>
  </body>
</html>
